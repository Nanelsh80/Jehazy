name: Build JEHAZY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Extract JEHAZY hotfix
        run: |
          rm -rf jehazi-hotfix
          unzip -q jehazi-flagship-v9.1.1-hotfix.zip
          test -f jehazi-hotfix/package.json
          test -f jehazi-hotfix/eas.json

      - name: Apply root-navigation fix
        run: |
          cat > jehazi-hotfix/app/_layout.tsx <<'EOF'
          import "../global.css";
          import { Stack, usePathname, useRouter } from "expo-router";
          import { useEffect, useState } from "react";
          import { Pressable, Text, View } from "react-native";
          import { StatusBar } from "expo-status-bar";
          import { ThemeProvider } from "@/lib/theme-provider";
          import { InventoryProvider, useInventory } from "@/lib/inventory-context";

          export default function RootLayout() {
            return (
              <ThemeProvider>
                <InventoryProvider>
                  <StatusBar style="dark" />
                  <Stack screenOptions={{ headerShown: false, contentStyle: { backgroundColor: "#F7F0E6" } }}>
                    <Stack.Screen name="auth" options={{ gestureEnabled: false }} />
                    <Stack.Screen name="onboarding" options={{ gestureEnabled: false }} />
                  </Stack>
                  <AppGate />
                </InventoryProvider>
              </ThemeProvider>
            );
          }

          function BootScreen({ slow }: { slow: boolean }) {
            return (
              <View style={{ position: "absolute", top: 0, right: 0, bottom: 0, left: 0, zIndex: 1000, backgroundColor: "#F7F0E6", alignItems: "center", justifyContent: "center", padding: 28 }}>
                <View style={{ width: 82, height: 82, borderRadius: 28, backgroundColor: "#34283A", alignItems: "center", justifyContent: "center", marginBottom: 18 }}>
                  <Text style={{ color: "#FFFDF9", fontSize: 40, fontWeight: "300", fontStyle: "italic" }}>J</Text>
                  <View style={{ position: "absolute", width: 11, height: 11, borderRadius: 6, backgroundColor: "#D6B06A", right: 18, bottom: 18 }} />
                </View>
                <Text style={{ color: "#34283A", fontSize: 22, fontWeight: "800", textAlign: "center" }}>جهازي</Text>
                <Text style={{ color: "#8B5E73", fontSize: 12, marginTop: 8, textAlign: "center" }}>{slow ? "بنجهّز مساحتك المحلية…" : "لحظة ونبدأ…"}</Text>
              </View>
            );
          }

          export function ErrorBoundary({ error, retry }: { error: Error & { digest?: string }; retry: () => void }) {
            return (
              <View style={{ flex: 1, backgroundColor: "#F7F0E6", alignItems: "center", justifyContent: "center", padding: 28 }}>
                <Text style={{ color: "#34283A", fontSize: 24, fontWeight: "800", textAlign: "center" }}>جهازي يحتاج إعادة فتح</Text>
                <Text style={{ color: "#8B7A70", fontSize: 13, lineHeight: 21, textAlign: "center", marginTop: 10 }}>حدث خطأ أثناء تشغيل الواجهة. اضغطي المحاولة مرة أخرى.</Text>
                <Pressable onPress={retry} style={{ marginTop: 22, backgroundColor: "#8B5E73", paddingHorizontal: 24, paddingVertical: 13, borderRadius: 15 }}>
                  <Text style={{ color: "#FFF9F0", fontWeight: "800" }}>إعادة المحاولة</Text>
                </Pressable>
                {__DEV__ ? <Text selectable style={{ color: "#9B6B6B", fontSize: 9, marginTop: 18, textAlign: "center" }}>{error?.message}</Text> : null}
              </View>
            );
          }

          function AppGate() {
            const { hydrated, onboardingComplete } = useInventory();
            const pathname = usePathname();
            const router = useRouter();
            const [bootSlow, setBootSlow] = useState(false);

            useEffect(() => {
              if (hydrated) return;
              const timer = setTimeout(() => setBootSlow(true), 2500);
              return () => clearTimeout(timer);
            }, [hydrated]);

            useEffect(() => {
              if (!hydrated) return;
              if (pathname === "/auth") {
                router.replace(onboardingComplete ? "/(tabs)" : "/onboarding?step=profile");
                return;
              }
              if (!onboardingComplete && pathname !== "/onboarding") {
                router.replace("/onboarding?step=welcome");
                return;
              }
              if (onboardingComplete && pathname === "/onboarding") {
                router.replace("/(tabs)");
              }
            }, [hydrated, onboardingComplete, pathname, router]);

            if (!hydrated) return <BootScreen slow={bootSlow} />;
            return null;
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          for name in ("package.json", "app.config.ts"):
              p = Path("jehazi-hotfix") / name
              s = p.read_text()
              s = s.replace('"version": "1.4.1"', '"version": "1.4.2"')
              s = s.replace('version: "1.4.0"', 'version: "1.4.2"')
              p.write_text(s)
          PY

      - name: Install pnpm
        run: npm install --global pnpm@9.12.0

      - name: Install dependencies
        working-directory: jehazi-hotfix
        run: pnpm install --frozen-lockfile

      - name: Verify production JavaScript bundle
        working-directory: jehazi-hotfix
        run: npx expo export --platform android

      - name: Build Android APK on EAS
        working-directory: jehazi-hotfix
        run: npx eas-cli@24.11.0 build --platform android --profile preview --non-interactive --no-wait
